<!doctype html>
<html lang="bg">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#070b13" />
        <!-- PWA-01: installable shell (manifest + icons + iOS home-screen tags) -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.webmanifest" />
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/favicon-32.png" />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/icons/icon.svg" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="BEG_Work" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="description" content="BEG_Work" />
        <!--
        SEC-03 (H-1, M-4, L-6): no third-party script and no inline script. Only the
        app's own bundle runs (analytics, when configured, is bundled — PWA-01 / R68);
        the former template's remote loaders, the framed "visual edits" loaders, the
        badge and its font are gone. The policy below is the build-templated CSP
        (nginx.conf adds frame-ancestors and the other configuration-independent
        directives). REACT_APP_CSP_API_ORIGIN / REACT_APP_CSP_ANALYTICS_ORIGIN are ORIGINS
        filled in by the build (empty when unset; analytics only with a key).
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: %REACT_APP_CSP_API_ORIGIN%; connect-src 'self' %REACT_APP_CSP_API_ORIGIN% %REACT_APP_CSP_ANALYTICS_ORIGIN%; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <title>BEG_Work</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
