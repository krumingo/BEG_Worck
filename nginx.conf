server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # SEC-03 (M-4): browser hardening on every response. `always` keeps the
    # headers on error responses too. The CSP matches the <meta> copy in
    # frontend/public/index.html; frame-ancestors (no framing by any site) can
    # only be sent as a header. The app is served same-origin (PUBLIC_URL), so
    # connect-src 'self' covers the API and the WebSocket. Analytics is not
    # allowed here; add its host to connect-src only when a key is configured.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API calls go to the backend container.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Uploaded files served by the backend.
    location /uploads/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # WebSocket, if the app uses it.
    location /ws {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Everything else is the React single-page app.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
