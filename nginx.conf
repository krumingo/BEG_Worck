server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # SEC-03 (M-4, FG-515): browser hardening on every response (`always` keeps
    # them on error responses too). This header carries only the directives that
    # never depend on configuration: no inline/foreign script, no plugins, no
    # <base>/form hijack, no framing by any site (frame-ancestors can only be a
    # header). connect-src / img-src / style-src / font-src are deliberately NOT
    # here: two CSPs are both enforced, so a fixed connect-src here would block an
    # analytics host that is configured at build time. They live in the <meta> CSP
    # of frontend/public/index.html, templated at build: the PostHog host
    # (REACT_APP_POSTHOG_HOST, default us.i.posthog.com) only when
    # REACT_APP_POSTHOG_KEY is set (frontend/craco.config.js).
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API calls go to the backend container.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Uploaded files served by the backend.
    location /uploads/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # WebSocket, if the app uses it.
    location /ws {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Everything else is the React single-page app.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
